<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Index Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Theme Switcher -->
        <div class="theme-switch-wrapper">
            <label class="theme-switch" for="theme-switch">
                <input type="checkbox" id="theme-switch">
                <div class="slider round"></div>
            </label>
            <span class="theme-text">Dark Mode</span>
        </div>

        <!-- Desktop View -->
        <div class="desktop-view">
            <h1 class="text-center mb-4">Air Quality Index Monitor</h1>
            
            <!-- Current AQI Section -->
            <div class="card mb-4">
                <div class="card-header">
                    <h2><i class="bi bi-cloud-sun"></i> Current AQI</h2>
                </div>
                <div class="card-body">
                    <div id="current-aqi" class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Historical Data Section -->
            <div class="card mb-4">
                <div class="card-header">
                    <h2><i class="bi bi-graph-up"></i> Historical Data</h2>
                </div>
                <div class="card-body">
                    <div id="historical-graph"></div>
                </div>
            </div>

            <!-- Leaderboard Section -->
            <div class="card">
                <div class="card-header">
                    <h2><i class="bi bi-trophy"></i> City Leaderboard</h2>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>City</th>
                                    <th>AQI</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="leaderboard-body">
                                <tr>
                                    <td colspan="4" class="text-center">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile View -->
        <div class="mobile-view" style="display: none;">
            <h1 class="text-center mb-4">Air Quality Index Monitor</h1>
            
            <!-- Mobile Navigation -->
            <div class="mobile-nav">
                <button class="nav-btn active" data-section="current-aqi">
                    <i class="bi bi-cloud-sun"></i>
                    <span>Current</span>
                </button>
                <button class="nav-btn" data-section="historical">
                    <i class="bi bi-graph-up"></i>
                    <span>History</span>
                </button>
                <button class="nav-btn" data-section="leaderboard">
                    <i class="bi bi-trophy"></i>
                    <span>Leaderboard</span>
                </button>
            </div>

            <!-- Mobile Sections -->
            <div id="current-aqi-mobile" class="mobile-section active">
                <div class="card">
                    <div class="card-body">
                        <div id="current-aqi-content" class="text-center">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="historical-mobile" class="mobile-section">
                <div class="card">
                    <div class="card-body">
                        <div id="historical-graph-mobile"></div>
                    </div>
                </div>
            </div>

            <div id="leaderboard-mobile" class="mobile-section">
                <div class="card">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>Rank</th>
                                        <th>City</th>
                                        <th>AQI</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="mobile-leaderboard-body">
                                    <tr>
                                        <td colspan="4" class="text-center">
                                            <div class="spinner-border text-primary" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
